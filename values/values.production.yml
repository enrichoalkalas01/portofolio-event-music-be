# portofolio-event-music-be
# Pipeline: deployPipeline (chart generic-app). All config lives here; no Vault.
# Public URL: https://endlessapp.my.id/server-api/portofolio-event-music-be/
# (ingress strips the prefix, so the app still serves /health and /api/v1/*).

appName: portofolio-event-music-be
namespace: portofolio
replicaCount: 1

image:
    repository: 192.168.20.21/other/portofolio-event-music-be
    tag: "latest" # OVERRIDDEN by the pipeline (commit sha)
    pullPolicy: Always

imagePullSecrets:
    - name: harbor-creds

nameOverride: ""
fullnameOverride: ""

containerPort: 5800

service:
    type: NodePort
    port: 5800
    targetPort: 5800
    nodePort: 30801 # OVERRIDDEN by the pipeline (param servicePort)

ingress:
    enabled: true
    className: nginx-endlessapp
    annotations:
        nginx.ingress.kubernetes.io/use-regex: "true"
        nginx.ingress.kubernetes.io/rewrite-target: /$1
        nginx.ingress.kubernetes.io/proxy-body-size: 10m
    hosts:
        - host: ""
          paths:
              - path: /server-api/portofolio-event-music-be/(.*)
                pathType: ImplementationSpecific
    tls: []

probe:
    enabled: true
    liveness:
        path: /health
        port: 5800
        initialDelaySeconds: 20
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    readiness:
        path: /health
        port: 5800
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3

resources:
    requests:
        cpu: 50m
        memory: 160Mi
    limits:
        cpu: 500m
        memory: 512Mi

autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

env:
    - name: NODE_ENV
      value: "production"
    - name: PORT
      value: "5800"
    - name: HOST
      value: "0.0.0.0"
    - name: APP_BASE_URL
      value: "https://endlessapp.my.id/server-api/portofolio-event-music-be"
    - name: CORS_ORIGINS
      value: "https://endlessapp.my.id,https://www.endlessapp.my.id"

    - name: MONGO_DB_URI
      value: "mongodb://root:MongoR00t!Pass2026@192.168.20.11:30717/portofolio_event_music_dev?authSource=admin"
    - name: SECRET_KEY
      value: "S3cr3tsN0Rump1!!!"

    - name: MINIO_ENDPOINT
      value: "192.168.20.16"
    - name: MINIO_PORT
      value: "31900"
    - name: MINIO_USE_SSL
      value: "false"
    - name: MINIO_ACCESS_KEY
      value: "minioadmin"
    - name: MINIO_SECRET_KEY
      value: "M1n10AdminPass!"
    - name: MINIO_DEFAULT_BUCKET
      value: "portofolio-event-music"

    # Midtrans sandbox. Set MIDTRANS_IS_PRODUCTION=true + live keys to go live.
    - name: MIDTRANS_IS_PRODUCTION
      value: "false"
    - name: MIDTRANS_MERCHANT_ID
      value: "G662361665"
    - name: MIDTRANS_CLIENT_KEY
      value: "SB-Mid-client-aOcgOhxD7Or8nkcF"
    - name: MIDTRANS_SERVER_KEY
      value: "SB-Mid-server-7OOJtkV08r6KUnMJq3CsdugS"
    - name: MIDTRANS_CALLBACK_URL
      value: "https://endlessapp.my.id/server-api/portofolio-event-music-be/api/v1"
    - name: MIDTRANS_CALLBACK_URL_DONE
      value: "https://endlessapp.my.id"

envFrom: []
volumeMounts: []
volumes: []
hostAliases: []
nodeSelector: {}
tolerations: []
affinity: {}
podSecurityContext: {}
securityContext: {}
serviceAccount:
    create: false
    name: ""
    annotations: {}
