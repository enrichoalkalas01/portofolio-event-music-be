appName: portofolio-event-music-be
namespace: portofolio
replicaCount: 1
image:
    repository: 192.168.20.21/other/portofolio-event-music-be
    tag: "latest"
    pullPolicy: Always
imagePullSecrets:
    - name: harbor-creds
nameOverride: ""
fullnameOverride: ""
containerPort: 5800
service:
    type: NodePort
    port: 5800
    targetPort: 5800
    nodePort: 31182 # OVERRIDDEN by the pipeline (param servicePort)
ingress:
    enabled: false
probe:
    enabled: false
    liveness:
        path: /
        port: 5800
    readiness:
        path: /
        port: 5800
resources:
    requests:
        cpu: 50m
        memory: 160Mi
    limits:
        cpu: 500m
        memory: 512Mi
autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
# Non-secret config only; secrets come from Vault via ESO.
env:
    - name: NODE_ENV
      value: "development"
    - name: PORT
      value: "5800"
    - name: HOST
      value: "0.0.0.0"
    - name: APP_BASE_URL
      value: "http://192.168.20.11:31182"
    - name: MIDTRANS_CALLBACK_URL
      value: "http://192.168.20.11:31182/api/v1"
    - name: MIDTRANS_CALLBACK_URL_DONE
      value: "http://192.168.20.11:31183/"
vaultRuntime:
    enabled: true
    path: portofolio-event-music-be
    dataFrom: true
    storeName: vault-backend
    storeKind: ClusterSecretStore
    refreshInterval: 1m
envFrom: []
volumeMounts: []
volumes: []
hostAliases: []
nodeSelector: {}
tolerations: []
affinity: {}
podSecurityContext: {}
securityContext: {}
serviceAccount:
    create: false
    name: ""
    annotations: {}
